name: Deploy to Freemius

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          mkdir -p build
          rsync -a --exclude-from=.distignore ./ build/advanced-product-filter/
          sed -i "/wp_org_gatekeeper/d" build/advanced-product-filter/advanced-product-filter.php
          cd build && zip -r ../advanced-product-filter.zip advanced-product-filter/

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "number=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Freemius
        uses: buttonizer/freemius-deploy@v0.1.2
        with:
          file_name: advanced-product-filter.zip
          release_mode: pending
          version: ${{ steps.version.outputs.number }}
          sandbox: false
        env:
          DEV_ID: ${{ secrets.FS_DEVELOPER_ID }}
          PLUGIN_ID: ${{ secrets.FS_PLUGIN_ID }}
          PUBLIC_KEY: ${{ secrets.FS_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.FS_SECRET_KEY }}
          PLUGIN_SLUG: advanced-product-filter
